<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="container auth-shell">
    <section class="auth-intro">
      <header class="brand compact">
        <div class="logo">CP</div>
        <div>
          <h1>Регистрация</h1>
          <p class="subtitle">Создание аккаунта для работы в системе</p>
        </div>
      </header>
      <div class="intro-copy">
        <span class="eyebrow">Быстрый старт</span>
        <h2>Новый пользователь подключается за минуту.</h2>
        <p>
          Зарегистрируйте учетную запись и сразу переходите к работе с заказами,
          ролями и статусами выполнения.
        </p>
      </div>
    </section>

    <section class="card auth-card">
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      <form method="post" action="/register">
        <label>
          Логин
          <input type="text" name="username" required />
        </label>
        <label>
          Пароль
          <input type="password" name="password" required />
        </label>
        <label>
          Роль
          <select name="role" required>
            <option value="customer">Заказчик</option>
            <option value="worker">Исполнитель</option>
            <option value="admin">Администратор</option>
          </select>
        </label>
        <button class="btn" type="submit">Создать аккаунт</button>
      </form>
      <p class="hint"><a href="/login">Уже есть аккаунт? Войти</a></p>
    </section>
  </main>
</body>
</html>
